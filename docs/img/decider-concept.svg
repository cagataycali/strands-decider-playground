<svg class="ld-fig" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 386" role="img" aria-labelledby="ld-fig-t ld-fig-d"><title id="ld-fig-t">What a Strands decider does</title><desc id="ld-fig-d">A decider reads a piece of state and a question and answers with one probability per option instead of generating text: yes or no, pick one, or rate on a scale. The public StrandsAgents deciders, grouped by base model, all answer the same question in the playground.</desc><style>:root{--bg:#fff;--fg:#000;--text:#3d3c3c;--muted:#767373;--hair:rgba(0,0,0,.15);--accent:#007a3d;--accent-soft:rgba(2,164,53,.12);--chip-bg:#f4f4f4;--sr-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){:root{--bg:#000;--fg:#fff;--text:#b6b6b6;--muted:#999696;--hair:#28292a;--accent:#00cc60;--accent-soft:rgba(0,204,96,.14);--chip-bg:#28292a}}svg{background:var(--bg)}.ld-fig{display: block; width: 100%; height: auto; overflow: visible;}.ld-fig text{font-family: var(--sr-mono);}.ld-fig .box{fill: var(--bg); stroke: var(--fg); stroke-width: 1;}.ld-fig .box.tilebox{stroke: var(--hair);}.ld-fig a.ld-tile{text-decoration: none; cursor: pointer;}.ld-fig .cluster{fill: none; stroke: var(--hair); stroke-width: 1; stroke-dasharray: 4 3;}.ld-fig .edge{fill: none; stroke: var(--muted); stroke-width: 1;}.ld-fig .edge.sig{stroke: var(--accent);}.ld-fig .frog{color: var(--accent);}.ld-fig .cap{font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; fill: var(--fg);}.ld-fig .cap.right{text-anchor: end;}.ld-fig .cap.promise{fill: var(--accent);}.ld-fig .mono{font-size: 11px; fill: var(--text);}.ld-fig .mono.muted{fill: var(--muted);}.ld-fig .mono.fg{fill: var(--fg); font-weight: 600;}.ld-fig .mono.name{font-size: 13px; font-weight: 600; fill: var(--fg); text-anchor: middle;}.ld-fig .mono.cap2{fill: var(--muted);}.ld-fig .mono.lab{text-anchor: end;}.ld-fig .mono.lab.best{fill: var(--fg); font-weight: 600;}.ld-fig .mono.val{fill: var(--muted);}.ld-fig .mono.val.best{fill: var(--accent); font-weight: 600;}.ld-fig .track{fill: var(--chip-bg);}.ld-fig .fill{fill: var(--accent); opacity: 0.5;}.ld-fig .fill.best, .ld-fig .fill.tfill{opacity: 1;}.ld-fig .chipbox{fill: var(--bg); stroke: var(--hair);}.ld-fig .chiplab{text-anchor: middle; fill: var(--muted);}.ld-fig .mono.grp{fill: var(--muted);}.ld-fig .mono.size{text-anchor: end; fill: var(--fg); font-weight: 600;}.ld-fig .mono.var{text-anchor: middle;}.ld-fig .mono.tiny{text-anchor: middle; fill: var(--muted);}.ld-fig .frame{opacity: 0;}.ld-fig .frame{opacity:0}.ld-fig .frame.f1{opacity:1}.ld-fig .chip.c1 .chipbox{stroke:var(--accent);fill:var(--accent-soft)}.ld-fig .chip.c1 .chiplab{fill:var(--fg)}.ld-fig .edge.bus{stroke:var(--accent)}.ld-fig .tilebox{stroke:var(--fg)}</style><defs><symbol id="ld-frog" viewBox="0 0 32 32">
