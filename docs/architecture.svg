<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 692" role="img" aria-labelledby="arch-t arch-d"><title id="arch-t">Strands decider: inside the model, and through this playground</title><desc id="arch-d">Top: a request (state, question, options) runs once through a frozen decoder base with a small LoRA; a 1M-parameter pointer head scores the hidden state at the answer position against each option's last token, one masked softmax turns the scores into a probability per option, read back as yes/no, pick one, or a rating. Bottom: registry.py lists the public StrandsAgents repos at start; one request goes through app.answer(), runner.py, cache.py and metrics.py into strands_decider, and every card, diagram and bench cell is rendered from the same result dict.</desc><style>:root{--bg:#fff;--fg:#000;--text:#3d3c3c;--muted:#767373;--hair:rgba(0,0,0,.15);--accent:#007a3d;--accent-soft:rgba(2,164,53,.12);--chip-bg:#f4f4f4;--sr-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){:root{--bg:#000;--fg:#fff;--text:#b6b6b6;--muted:#999696;--hair:#28292a;--accent:#00cc60;--accent-soft:rgba(0,204,96,.14);--chip-bg:#28292a}}svg{background:var(--bg)}text{font-family:var(--sr-mono);font-size:11px;fill:var(--text)}.title{font-weight:600;fill:var(--fg)}.muted{fill:var(--muted)}.mid{text-anchor:middle}.end{text-anchor:end}.cap{font-size:11px;letter-spacing:.05em;text-transform:uppercase;fill:var(--fg)}.box{fill:var(--bg);stroke:var(--fg);stroke-width:1}.box.accent{stroke:var(--accent)}.box.out{stroke:var(--hair)}.box.in{stroke:var(--hair)}.cluster{fill:none;stroke:var(--hair);stroke-width:1;stroke-dasharray:4 3}.edge{fill:none;stroke:var(--muted);stroke-width:1}.edge.sig{stroke:var(--accent)}.pill{fill:var(--accent)}.onaccent{fill:var(--bg);font-weight:600}</style><rect x="16" y="42" width="928" height="236" rx="8" class="cluster"/><text x="16" y="34" class="cap">inside a decider · one forward pass, no generated text</text><rect x="32" y="64" width="182" height="92" rx="8" class="box in"/><text x="44" y="81" class="t title">request</text><text x="44" y="96" class="t">state</text><text x="44" y="111" class="t">question</text><text x="44" y="126" class="t">options:</text><text x="44" y="141" class="t">billing · sales · retail</text><rect x="254" y="64" width="202" height="77" rx="8" class="box "/><text x="266" y="81" class="t title">frozen base (decoder)</text><text x="266" y="96" class="t">LoRA of rank r on the torso</text><text x="266" y="111" class="t">LM head discarded</text><text x="266" y="126" class="t">trained: LoRA + head only</text><rect x="496" y="64" width="176" height="77" rx="8" class="box "/><text x="508" y="81" class="t title">last hidden states</text><text x="508" y="96" class="t">h(&lt;answer&gt;)</text><text x="508" y="111" class="t">h(option k), last token</text><text x="508" y="126" class="t">for every option k</text><rect x="712" y="64" width="209" height="62" rx="8" class="box accent"/><text x="724" y="81" class="t title">pointer head</text><text x="724" y="96" class="t">~1M params, fp32</text><text x="724" y="111" class="t">score_k = h(&lt;answer&gt;)·W·h(k)</text><path d="M214 84 L254 84" class="edge "/><path d="M249 81 l5 3 -5 3" class="edge "/><path d="M456 84 L496 84" class="edge "/><path d="M491 81 l5 3 -5 3" class="edge "/><path d="M672 84 L712 84" class="edge sig"/><path d="M707 81 l5 3 -5 3" class="edge sig"/><rect x="692" y="150" width="229" height="47" rx="8" class="box "/><text x="704" y="167" class="t title">one masked softmax</text><text x="704" y="182" class="t">p = softmax(score) over options</text><path d="M816.5 126 L816.5 150" class="edge sig"/><path d="M813.5 145 l3 5 3 -5" class="edge sig"/><rect x="613" y="221" width="64" height="47" rx="8" class="box out"/><text x="625" y="238" class="t title">noul</text><text x="625" y="253" class="t">P(yes)</text><path d="M645.0 197 L645.0 221" class="edge sig"/><path d="M642.0 216 l3 5 3 -5" class="edge sig"/><rect x="689" y="221" width="77" height="47" rx="8" class="box out"/><text x="701" y="238" class="t title">choice</text><text x="701" y="253" class="t">argmax p</text><path d="M727.5 197 L727.5 221" class="edge sig"/><path d="M724.5 216 l3 5 3 -5" class="edge sig"/><rect x="778" y="221" width="143" height="47" rx="8" class="box out"/><text x="790" y="238" class="t title">score</text><text x="790" y="253" class="t">E[level] = Σ k·p_k</text><path d="M849.5 197 L849.5 221" class="edge sig"/><path d="M846.5 216 l3 5 3 -5" class="edge sig"/><text x="32" y="186" class="t muted">an answer costs one forward pass of the base plus a dot product per option;</text><text x="32" y="202" class="t muted">nothing is generated, so there is nothing to parse and no hallucinated option.</text><text x="32" y="218" class="t muted">the same p is read back three ways: yes/no (noul) · pick one (choice) · a rating (score).</text><rect x="16" y="324" width="928" height="352" rx="8" class="cluster"/><text x="16" y="316" class="cap">this playground · one request, every listed model, one result dict</text><rect x="32" y="346" width="176" height="77" rx="8" class="box "/><text x="44" y="363" class="t title">Hugging Face</text><text x="44" y="378" class="t">StrandsAgents org</text><text x="44" y="393" class="t">public decider repos</text><text x="44" y="408" class="t">config + evals per repo</text><rect x="232" y="346" width="169" height="77" rx="8" class="box "/><text x="244" y="363" class="t title">registry.py · at start</text><text x="244" y="378" class="t">lists the org live</text><text x="244" y="393" class="t">public repos only</text><text x="244" y="408" class="t">reads config + evals</text><rect x="425" y="346" width="182" height="77" rx="8" class="box "/><text x="437" y="363" class="t title">app.answer()</text><text x="437" y="378" class="t">state · question · image</text><text x="437" y="393" class="t">per model: load, ask,</text><text x="437" y="408" class="t">measure -&gt; one card</text><rect x="631" y="346" width="143" height="47" rx="8" class="box "/><text x="643" y="363" class="t title">runner.py</text><text x="643" y="378" class="t">one lock per model</text><rect x="631" y="405" width="156" height="47" rx="8" class="box "/><text x="643" y="422" class="t title">cache.py</text><text x="643" y="437" class="t">load · evict by base</text><rect x="631" y="464" width="130" height="47" rx="8" class="box "/><text x="643" y="481" class="t title">metrics.py</text><text x="643" y="496" class="t">memory · latency</text><rect x="798" y="346" width="123" height="47" rx="8" class="box accent"/><text x="810" y="363" class="t title">strands_decider</text><text x="810" y="378" class="t">engine.ask(...)</text><path d="M208 366 L232 366" class="edge "/><path d="M227 363 l5 3 -5 3" class="edge "/><path d="M401 366 L425 366" class="edge "/><path d="M420 363 l5 3 -5 3" class="edge "/><path d="M607 366 L631 366" class="edge "/><path d="M626 363 l5 3 -5 3" class="edge "/><path d="M774 366 L798 366" class="edge sig"/><path d="M793 363 l5 3 -5 3" class="edge sig"/><rect x="476.0" y="529" width="80" height="18" rx="9" class="pill"/><text x="516.0" y="542" class="t mid onaccent">card dict</text><path d="M516.0 423 L516.0 529" class="edge sig"/><path d="M513.0 524 l3 5 3 -5" class="edge sig"/><rect x="32" y="571" width="196" height="62" rx="8" class="box "/><text x="44" y="588" class="t title">app.py cards</text><text x="44" y="603" class="t">probabilities · confidence</text><text x="44" y="618" class="t">published evals · compute</text><path d="M516.0 547 V559.0 H130.0 V571" class="edge sig"/><path d="M127.0 566 l3 5 3 -5" class="edge sig"/><rect x="261.0" y="571" width="209" height="62" rx="8" class="box "/><text x="273.0" y="588" class="t title">viz.py</text><text x="273.0" y="603" class="t">sum of decisions · multiples</text><text x="273.0" y="618" class="t">confidence vs size</text><path d="M516.0 547 V559.0 H365.5 V571" class="edge sig"/><path d="M362.5 566 l3 5 3 -5" class="edge sig"/><rect x="503.0" y="571" width="196" height="62" rx="8" class="box "/><text x="515.0" y="588" class="t title">bench/</text><text x="515.0" y="603" class="t">231 JevBench tasks · board</text><text x="515.0" y="618" class="t">common errors</text><path d="M516.0 547 V559.0 H601.0 V571" class="edge sig"/><path d="M598.0 566 l3 5 3 -5" class="edge sig"/><rect x="732.0" y="571" width="196" height="62" rx="8" class="box "/><text x="744.0" y="588" class="t title">landing.py · examples.py</text><text x="744.0" y="603" class="t">concept figure · model row</text><text x="744.0" y="618" class="t">clickable examples</text><path d="M516.0 547 V559.0 H830.0 V571" class="edge sig"/><path d="M827.0 566 l3 5 3 -5" class="edge sig"/><text x="32" y="664" class="t muted">every number on the page is read from that one card dict; nothing is recomputed, and a number that cannot be measured says so.</text></svg>
